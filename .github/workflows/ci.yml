name: C++ and Python tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: ghcr.io/coe-marble/rpp-test-container:lyrical-ubuntu26.04-capnp1.1.0-v1
    defaults:
      run:
        shell: bash
    env:
      ROS_DISTRO: lyrical
    steps:
      - name: Check out repository under test
        uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - name: Check out RPP integration dependencies
        uses: actions/checkout@v4
        with:
          repository: coe-marble/rpp_dev
          ref: ${{ (github.base_ref || github.ref_name) == 'develop' && 'develop' || 'main' }}
          path: rpp_dev
          submodules: recursive
          token: ${{ secrets.RPP_CI_TOKEN || github.token }}
          persist-credentials: false
      - name: Overlay the repository under test
        run: rsync -a --delete --exclude=.git candidate/ rpp_dev/src/rpp_interfaces/
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y ros-lyrical-ament-cmake-python ros-lyrical-ament-cmake-pytest
          for package in rpp_common rpp_plugin_registrator rpp_orchestrator rpp_py rpp_cli rpp_testing; do
            python -m pip install --no-deps -e "rpp_dev/src/$package"
          done
      - name: Build the C++ runtime and generate interface headers
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --base-paths rpp_dev/src/rpp_cpp --symlink-install --cmake-args \
            -DBUILD_TESTING=OFF -DPython3_EXECUTABLE=/opt/rpp-test-venv/bin/python
          source install/setup.bash
          rpp registry config set RPP_CPP_CORE_PATH "$PWD/build/rpp_cpp"
          rpp init-home
          rpp library register "$PWD/rpp_dev/src/rpp_interfaces" --link
      - name: Build rpp_interfaces with C++ and Python tests
        run: |
          source /opt/ros/lyrical/setup.bash
          source install/setup.bash
          colcon build --base-paths rpp_dev/src/rpp_interfaces --symlink-install --cmake-args \
            -DBUILD_TESTING=ON -DPython3_EXECUTABLE=/opt/rpp-test-venv/bin/python
      - name: Run C++ and Python tests
        run: |
          source /opt/ros/lyrical/setup.bash
          source install/setup.bash
          colcon test --packages-select rpp_interfaces --event-handlers console_direct+ \
            --return-code-on-test-failure
      - name: Report test results
        if: ${{ !cancelled() }}
        run: colcon test-result --verbose
